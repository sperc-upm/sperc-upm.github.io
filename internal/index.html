        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #4CAF50;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #4CAF50;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #76B852;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        :root {
  color-scheme: light;
  --paper: #F4F5F3;
  --ink: #13222A;
  --ink-2: #4A5C64;
  --frond: #2F5E6E; /* flask slate: links, nav, main series */
  --ember: #B3202A; /* gear red: accent, focus */
  --leaf: #4E8A2A; /* leaf green: second series (graphics only, 3.9:1) */
  --fibre: #CBD3D5;
  --wash: #E6ECED;
  --display: 'Bodoni Moda Variable', Georgia, serif;
  --text: 'Hanken Grotesk', Arial, sans-serif;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;
  --s-9: 96px; --s-10: 128px;
  --type-1: 14px; --type-2: 16px; --type-3: 18px; --type-4: 24px;
  --type-5: 32px; --type-6: 42px; --type-7: 56px; --type-8: 75px; --type-9: 100px;
  --gutter: 24px;
  --page-width: 1320px;
}
[data-theme='dark'] {
  color-scheme: dark;
  --paper: #0D1417; --ink: #E7ECEE; --ink-2: #A5B3B9;
  --frond: #8DB6C6; --ember: #EE6A70; --leaf: #9BD06B; --fibre: #25343A; --wash: #142128;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    color-scheme: dark;
    --paper: #0D1417; --ink: #E7ECEE; --ink-2: #A5B3B9;
    --frond: #8DB6C6; --ember: #EE6A70; --leaf: #9BD06B; --fibre: #25343A; --wash: #142128;
  }
}
@media (max-width: 600px) { :root { --gutter: 16px; } }

.staticrypt-body, .staticrypt-html { background: var(--paper); color: var(--ink); font-family: var(--text); }
.staticrypt-content { background: var(--paper) !important; height: auto; min-height: 100vh; display: grid; place-items: center; }
.staticrypt-page { width: min(420px, calc(100% - 32px)); margin: 0; padding: 0; max-width: none; }
.staticrypt-form { background: transparent; box-shadow: none; padding: 0; max-width: none; text-align: left; }
.staticrypt-instructions p { color: var(--ink-2); margin: 0 0 8px; font-size: 16px; line-height: 1.5; }
.staticrypt-title { font: 400 42px/1.1 var(--display) !important; color: var(--ink) !important; letter-spacing: -.02em; margin-bottom: 12px !important; }
.staticrypt-hr { border: 0; border-top: 1px solid var(--fibre); margin: 24px 0; }
.staticrypt-form input[type="password"], .staticrypt-form input[type="text"] { background: var(--paper); color: var(--ink); border: 1px solid var(--fibre); border-radius: 2px; font: 18px var(--text); padding: 12px 44px 12px 12px; }
.staticrypt-form input:focus-visible, .staticrypt-decrypt-button:focus-visible { outline: 3px solid var(--ember); outline-offset: 3px; }
.staticrypt-form .staticrypt-decrypt-button { background: var(--frond) !important; color: var(--paper); border-radius: 2px; font: 500 16px var(--text); text-transform: none; min-height: 48px; }
.staticrypt-form .staticrypt-decrypt-button:hover { background: var(--ink) !important; }
.staticrypt-toggle-password-visibility { filter: none; opacity: .6; }
.sperc-mark { width: 64px; height: auto; display: block; margin-bottom: 24px; }
.sperc-mark.dark { display: none; }
@media (prefers-color-scheme: dark) { .sperc-mark { display: none; } .sperc-mark.dark { display: block; } .staticrypt-toggle-password-visibility { filter: invert(1); } }
</style>
